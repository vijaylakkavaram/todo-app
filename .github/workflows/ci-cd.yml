name: CI / CD — Task Manager

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1 — Lint & Test  (runs on every push + PR)
  # ─────────────────────────────────────────────────────────────
  test:
    name: 🧪 Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check server starts OK
        run: |
          node src/server.js &
          SERVER_PID=$!
          sleep 3
          curl -f http://localhost:3000/health || (echo "Health check failed" && kill $SERVER_PID && exit 1)
          kill $SERVER_PID
          echo "✅ Server started and health check passed"

  # ─────────────────────────────────────────────────────────────
  # JOB 2 — Deploy to Render  (only on push to main)
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Render
    runs-on: ubuntu-latest
    needs: test                   # only deploy if tests pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy
        run: |
          curl -s -o response.json -w "%{http_code}" \
            --request POST \
            --url "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            --header "accept: application/json" \
            --header "content-type: application/json" \
            --header "authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            --data '{}' > http_status.txt

          HTTP_STATUS=$(cat http_status.txt)
          echo "Render API responded with HTTP $HTTP_STATUS"
          cat response.json

          if [ "$HTTP_STATUS" -ne 201 ]; then
            echo "❌ Deploy trigger failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Deploy triggered successfully"

      - name: Wait and verify deployment
        run: |
          echo "⏳ Waiting 60s for Render to deploy..."
          sleep 60
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_APP_URL }}/health")
          echo "Health check returned HTTP $HTTP"
          if [ "$HTTP" -ne 200 ]; then
            echo "❌ Deployed app health check failed"
            exit 1
          fi
          echo "✅ App is live at ${{ secrets.RENDER_APP_URL }}"
